<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Jetson Nano YOLOv5 Golden Image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#101a12"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#b6ff3d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#76B900" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g stroke="#76B900" stroke-opacity="0.25" fill="none" stroke-width="1.5">
    <path d="M0 250 H120 L150 220 H300"/>
    <path d="M0 60 H90 L120 90 H240"/>
    <path d="M1200 70 H1080 L1050 100 H930"/>
    <path d="M1200 240 H1100 L1070 210 H960"/>
  </g>
  <g fill="#76B900" fill-opacity="0.5">
    <circle cx="300" cy="220" r="3"/><circle cx="240" cy="90" r="3"/>
    <circle cx="930" cy="100" r="3"/><circle cx="960" cy="210" r="3"/>
  </g>

  <!-- detection boxes: the YOLO motif -->
  <g fill="none" stroke-width="2.5">
    <g stroke="url(#cyan)" stroke-opacity="0.85">
      <rect x="132" y="96" width="118" height="108" rx="4"/>
      <rect x="952" y="120" width="96" height="86" rx="4"/>
    </g>
    <g stroke="#76B900" stroke-opacity="0.7">
      <rect x="86" y="140" width="72" height="70" rx="4"/>
      <rect x="1024" y="86" width="64" height="60" rx="4"/>
    </g>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#00e5ff" fill-opacity="0.9">
    <text x="132" y="90">person 0.94</text>
    <text x="952" y="114">car 0.88</text>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="600" y="112" font-size="30" letter-spacing="9" fill="#76B900" fill-opacity="0.95">NVIDIA JETSON NANO</text>
    <text x="600" y="186" font-size="66" font-weight="800" fill="url(#green)" filter="url(#glow)">YOLOv5 GOLDEN IMAGE</text>
    <text x="600" y="228" font-size="17" letter-spacing="3" fill="#9fb3a0">FLASH · BOOT · DETECT</text>
  </g>

  <!-- spec strip -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#7f8f7f" text-anchor="middle">
    <text x="600" y="266">JetPack 4.6.6  ·  L4T R32.7.6  ·  CUDA 10.2  ·  PyTorch 1.10  ·  TensorRT engine included</text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="url(#cyan)"/>
</svg>
